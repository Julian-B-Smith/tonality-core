name: parity

# The port's half of the parity loop
# (integrations/tonality-core/notice-ci-required.md, Tonality dev loop, 2026-07-09).
# Every push to main and every pull request rebuilds the core FROM SOURCE and
# reruns the parity harness the watcher PRs previously ran by hand — no new
# tests, just automation of the definition of done.
#
# CROSS-PLATFORM SPLIT (empirical, PR #6 first run):
#   - macOS is the canonical platform: fixtures/tonality/*.json were exported by
#     the CPython engine on macOS, so byte-for-byte float parity (DFT magnitudes/
#     phases, reflection_residual) is reproducible there. macos-latest runs the
#     FULL harness including the byte-exact parity_table + parity_bindings.
#   - ubuntu-latest is the portability probe. Byte-exactness is NOT a cross-
#     platform invariant: glibc vs Apple libm differ by ~1 ulp on transcendental
#     DFT terms (PR #6 saw dft_magnitude 1.0 vs 0.9999999999999999), and shortest-
#     repr JSON turns that ulp into different bytes. So Linux BUILDS from source
#     (proves the headers compile under GCC + the algorithm ports) and checks
#     values within tolerance (rel 1e-9 / abs 1e-12) instead of bytes — the same
#     tolerancing the engine's own test_port_pin.py uses for float fields.
#     Since the ratification (integrations/tonality-core/ratify-ci-required.md,
#     2026-07-13) that probe covers ALL 4096 rows, not one golden case:
#     parity_bindings_tolerance. Integer fields stay exact on both legs.
# fail-fast is off so each OS reports independently.
#
# The macOS runner is pinned to macos-15 (arm64) ON PURPOSE. The contract makes
# macOS canonical, so the byte-exact leg is hostage to the image's libm: a
# rolling macos-latest could roll to a new Xcode/libm, flip a ulp, and red the
# canonical leg on a non-bug — exactly what the split exists to prevent.
#
# It must be macos-15 specifically, and that is measured, not assumed. The
# ratification recommended macos-14 (arm64); pinning there turned the canonical
# leg RED (CI run 30413344944): macos-14's libm gives reflection_residual +0.0
# where the fixture has -0.0, one signed zero that shortest-repr JSON turns into
# a byte difference. The fixtures are generated on macOS 15.3 arm64, and the
# binding constraint is the libm VERSION, not just the arch — so the canonical
# leg must pin to the image matching the generating platform. (This is the
# ratification's own hazard, confirmed harder than stated: an image roll really
# does flip a ulp — it just bites when rolling backwards too.)
#
# ubuntu stays rolling: a portability probe wants toolchain drift.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical platform: full byte-exact harness. Pinned image (the one
          # the fixtures were generated on), not macos-latest — see header note.
          - os: macos-15
            ctest_filter: ""
          # Portability probe: build + all 4096 rows within tolerance (byte-exact
          # float parity is platform-specific — see header note).
          - os: ubuntu-latest
            # Quoted: this value is substituted into a shell command, where a
            # bare `|` would be a pipe, not a ctest regex alternation.
            ctest_filter: "-R 'parity_conformance|parity_bindings_tolerance'"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # parity_bindings builds the pybind11 fast path and runs it against the
      # vendored fixtures (no live engine import — it reads fixtures/tonality/).
      - name: Install pybind11
        run: python -m pip install --upgrade pip pybind11

      # -ffp-contract=off is applied by CMakeLists for GCC (ubuntu) and AppleClang
      # (macOS) alike — required for Python-identical FMA behaviour.
      - name: Configure (Release, pybind11 fast path on)
        run: >
          cmake -S . -B build-release
          -DCMAKE_BUILD_TYPE=Release
          -DTONALITY_BUILD_PYTHON=ON
          -DPython_EXECUTABLE='${{ steps.python.outputs.python-path }}'

      - name: Build
        run: cmake --build build-release --config Release -j

      # macOS: parity_table (4096 rows byte-for-byte) + parity_conformance
      # (set_class_info, all fields) + parity_bindings (byte-identical emit +
      # 4096 dict-equal) + parity_bindings_tolerance. ubuntu: parity_conformance
      # + parity_bindings_tolerance (4096 rows, floats toleranced, ints exact).
      - name: Parity harness (ctest)
        run: >
          ctest --test-dir build-release --build-config Release --output-on-failure
          ${{ matrix.ctest_filter }}

  # CI mirrors the Stop hook (kit 2.0.0): the same ./verify fast a local session
  # is gated on. Cheap and Linux-only on purpose — it runs the privacy gate, the
  # kit-integrity checksum and the fixture PIN hashes, none of which need a
  # compiler. It does NOT duplicate the parity matrix above: with no build tree
  # in a fresh checkout, ./verify fast reports that parity was not exercised
  # here and leaves it to the `parity` job, which is the real oracle.
  harness:
    name: harness (./verify fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify fast
        run: ./verify fast
